[platformio]
include_dir  = include
src_dir      = src
default_envs = native

[env:native]
platform=native
build_flags =
    -g
    -D DESKTOP_SIM
    -D PIO_VERBOSE=1
    -D FLASHMEM=
    -lSDL
build_src_filter =
    +<*.cpp>
    -<stm32.cpp>
    -<stm32main.cpp>
    -<teensymain.cpp>

[env:stm32h7]
platform=ststm32
framework=arduino
board=weact_mini_h743vitx
lib_ldf_mode = chain+
build_flags =
    -g
    -D PIO_VERBOSE=1
    -DHSE_VALUE=25000000
    -DIBB_STM32
    -DIBB_STM32H7
    -D FLASHMEM=
    -Wl,-u_printf_float
    -Wno-psabi

build_src_filter =
    +<*.cpp>
    -<pcmain.cpp>
    -<teensymain.cpp>

[env:teensy41]
platform=teensy
board=teensy41
framework=arduino
upload_protocol = teensy-cli
lib_ldf_mode = chain+
build_flags =
    -g
    -D PIO_VERBOSE=1
    -D SMALL_SCREEN
    -Wl,-u_printf_float
    -Wno-psabi

build_src_filter =
    +<*.cpp>
    -<pcmain.cpp>
    -<stm32.cpp>
    -<stm32main.cpp>
